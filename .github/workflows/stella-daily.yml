name: Stella Daily Content Generation

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 9:00 JST (= 0:00 UTC)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'TEST MODE（チェックするとAPIなしでサンプル記事を生成）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests markdown pillow playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Generate 5 Stella articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: |
          for i in 1 2 3 4 5; do
            echo "=============================="
            echo "記事 ${i}/5 を生成中... (TEST_MODE=${TEST_MODE})"
            echo "=============================="
            python3 scripts/generate_stella.py --article $i
            echo "記事 ${i}/5 完了"
            sleep 5
          done

      - name: Generate eyecatch images
        run: |
          for dir in stella/content/output/*/; do
            if [ -f "${dir}content.json" ] && [ ! -f "${dir}images/eyecatch.png" ]; then
              echo "アイキャッチ生成: ${dir}"
              python3 scripts/generate_eyecatch.py "${dir}"
            fi
          done

      - name: Check note secrets
        env:
          NOTE_SESSION_JSON: ${{ secrets.NOTE_SESSION_JSON }}
          NOTE_EMAIL:        ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD:     ${{ secrets.NOTE_PASSWORD }}
        run: |
          if [ -n "${NOTE_SESSION_JSON}" ]; then
            echo "Secrets OK: NOTE_SESSION_JSON が登録されています（Cookie方式）"
          elif [ -n "${NOTE_EMAIL}" ] && [ -n "${NOTE_PASSWORD}" ]; then
            echo "Secrets OK: NOTE_EMAIL+NOTE_PASSWORD が登録されています（フォーム方式）"
            echo "::warning::フォーム方式は reCAPTCHA により失敗する可能性があります。"
            echo "           scripts/save_note_session.py を実行して NOTE_SESSION_JSON を登録することを推奨します。"
          else
            echo "::error::NOTE_SESSION_JSON または NOTE_EMAIL+NOTE_PASSWORD が未登録です。"
            echo ""
            echo "推奨セットアップ:"
            echo "  1. python3 scripts/save_note_session.py をローカルで実行"
            echo "  2. 出力の JSON を GitHub Secret NOTE_SESSION_JSON に登録"
            echo "  （Settings → Secrets and variables → Actions）"
            exit 1
          fi

      - name: Post drafts to note
        env:
          NOTE_SESSION_JSON: ${{ secrets.NOTE_SESSION_JSON }}
          NOTE_EMAIL:        ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD:     ${{ secrets.NOTE_PASSWORD }}
        run: |
          posted=0
          failed=0
          for dir in stella/content/output/*/; do
            if [ -f "${dir}content.json" ] && [ ! -f "${dir}draft-url.txt" ]; then
              echo "=============================="
              echo "note 投稿: ${dir}"
              echo "=============================="
              if python3 scripts/post_to_note.py "${dir}"; then
                posted=$((posted + 1))
              else
                echo "::warning::投稿失敗: ${dir}"
                failed=$((failed + 1))
              fi
              sleep 10
            fi
          done
          echo "投稿完了: ${posted} 記事 / 失敗: ${failed} 記事"

      - name: Commit and push
        run: |
          git config user.name "Stella Bot"
          git config user.email "stella-bot@auto.com"
          git add stella/content/output/
          git diff --staged --quiet || git commit -m "feat: auto-generate 5 stella articles ($(date +%Y-%m-%d))"
          git push

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
