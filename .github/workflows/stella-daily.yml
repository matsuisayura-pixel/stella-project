name: Stella Daily Content Generation

on:
  schedule:
    - cron: '0 0 * * *'  # 毎日 9:00 JST (= 0:00 UTC)
  workflow_dispatch:      # 手動実行ボタン

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests markdown

      - name: Generate 5 Stella articles
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          for i in 1 2 3 4 5; do
            echo "=============================="
            echo "記事 ${i}/5 を生成中..."
            echo "=============================="
            python3 scripts/generate_stella.py --article $i
            echo "記事 ${i}/5 完了"
            sleep 5
          done

      - name: Commit and push
        run: |
          git config user.name "Stella Bot"
          git config user.email "stella-bot@auto.com"
          git add stella/content/output/
          git diff --staged --quiet || git commit -m "feat: auto-generate 5 stella articles ($(date +%Y-%m-%d))"
          git push

      - name: Build static site
        run: python3 scripts/build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
